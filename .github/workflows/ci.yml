name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VFLAGS: -no-parallel

jobs:
  checks:
    name: Checks (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leveldb
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v

      - name: Checkout leveldb
        uses: actions/checkout@v7
        with:
          path: leveldb

      - name: Build V
        working-directory: .
        run: |
          make
          ./v symlink -githubci

      - name: Link the module into V's module path
        run: make link

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Run the test suite
        run: make test

      - name: Build and run the example
        run: make example

      - name: Build and run the example, optimised
        run: make example-prod

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: leveldb
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v

      - name: Checkout leveldb
        uses: actions/checkout@v7
        with:
          path: leveldb

      - name: Build V
        working-directory: .
        run: |
          make
          ./v symlink -githubci

      - name: Run the test suite
        run: make test

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: leveldb
    continue-on-error: true
    steps:
      - name: Checkout V
        uses: actions/checkout@v7
        with:
          repository: vlang/v

      - name: Checkout leveldb
        uses: actions/checkout@v7
        with:
          path: leveldb

      - name: Build V
        working-directory: .
        run: |
          .\makev.bat -msvc
          .\v.exe symlink -githubci

      - name: Run the test suite
        shell: pwsh
        run: |
          v test .
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            "Windows: the suite passed." | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } else {
            "Windows: the suite failed (exit $code). This job is informational while the port is unverified. The log above has the detail." |
              Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

          # Reported, not enforced.
          exit 0

  actions:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2
