name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VFLAGS: -no-parallel

jobs:
  checks:
    name: Checks (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: leveldb
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v7
        with:
          repository: vlang/v

      - name: Checkout leveldb
        id: checkout_leveldb
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          path: leveldb

      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.checkout_leveldb.outcome == 'success' }}
        working-directory: .
        run: |
          make
          ./v symlink -githubci

      - name: Link the module into V's module path
        id: link_the_module_into_v_s_module_path
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: make link

      - name: Verify formatting
        id: verify_formatting
        if: ${{ success() && !cancelled() && steps.link_the_module_into_v_s_module_path.outcome == 'success' }}
        run: make fmt-check

      - name: Vet
        id: vet
        if: ${{ success() && !cancelled() && steps.verify_formatting.outcome == 'success' }}
        run: make vet

      - name: Run the test suite
        id: run_the_test_suite
        if: ${{ success() && !cancelled() && steps.vet.outcome == 'success' }}
        run: make test

      - name: Build and run the example
        id: build_and_run_the_example
        if: ${{ success() && !cancelled() && steps.run_the_test_suite.outcome == 'success' }}
        run: make example

      - name: Build and run the example, optimised
        id: build_and_run_the_example_optimised
        if: ${{ success() && !cancelled() && steps.build_and_run_the_example.outcome == 'success' }}
        run: make example-prod

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: leveldb
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v7
        with:
          repository: vlang/v

      - name: Checkout leveldb
        id: checkout_leveldb
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          path: leveldb

      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.checkout_leveldb.outcome == 'success' }}
        working-directory: .
        run: |
          make
          ./v symlink -githubci

      - name: Run the test suite
        id: run_the_test_suite
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: make test

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    env:
      # Explicit test parallelism: a worker peaks near 0.25 GB,
      # so this stays CPU-bound with ample headroom.
      VJOBS: '4'
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 60
    defaults:
      run:
        working-directory: leveldb
    continue-on-error: true
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v7
        with:
          repository: vlang/v

      - name: Checkout leveldb
        id: checkout_leveldb
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          path: leveldb

      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.checkout_leveldb.outcome == 'success' }}
        working-directory: .
        run: |
          .\makev.bat -msvc
          .\v.exe symlink -githubci

      - name: Run the test suite
        id: run_the_test_suite
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        shell: pwsh
        run: |
          v test .
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            "Windows: the suite passed." | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } else {
            "Windows: the suite failed (exit $code). This job is informational while the port is unverified. The log above has the detail." |
              Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

          # Reported, not enforced.
          exit 0

  actions:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7

      - name: Lint the workflows
        id: lint_the_workflows
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
        uses: raven-actions/actionlint@v2
